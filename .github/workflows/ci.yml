name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: velvetscoop
          POSTGRES_PASSWORD: velvetscoop
          POSTGRES_DB: velvetscoop_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U velvetscoop"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @velvet-scoop/backend exec prisma generate

      - name: Apply test DB migrations
        run: pnpm --filter @velvet-scoop/backend exec prisma migrate deploy
        env:
          DATABASE_URL: postgres://velvetscoop:velvetscoop@localhost:5433/velvetscoop_test

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test (backend)
        run: pnpm --filter @velvet-scoop/backend test
        env:
          DATABASE_URL: postgres://velvetscoop:velvetscoop@localhost:5433/velvetscoop_test
          REDIS_URL: redis://localhost:6380

      - name: Build (all)
        run: pnpm -r build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
