services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    image: velvet-scoop-backend:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_EXTRA_CA_CERTS: /etc/ssl/extra/cloudflare-ca.crt
    volumes:
      - /usr/local/share/ca-certificates/cloudflare-origin-ca.crt:/etc/ssl/extra/cloudflare-ca.crt:ro
    networks:
      - default
      - shared-db
      - shared-redis

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    image: velvet-scoop-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3006:80"

networks:
  shared-db:
    external: true
  shared-redis:
    external: true
